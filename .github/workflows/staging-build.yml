name: KAYAN Staging Build

on:
  push:
    branches:
      - rc1-staging
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build KAYAN ERP staging
        run: npm run build

      - name: Verify Next.js runtime configuration
        shell: bash
        run: |
          echo '=== PACKAGE SCRIPTS ==='
          node -e "const p=require('./package.json'); console.log(JSON.stringify(p.scripts||{}, null, 2))"
          echo '=== ENVIRONMENT VARIABLE NAMES (values are never printed) ==='
          grep -RhoE 'process\.env\.[A-Z][A-Z0-9_]*|NEXT_PUBLIC_[A-Z][A-Z0-9_]*|SUPABASE_[A-Z][A-Z0-9_]*' app lib components middleware.ts 2>/dev/null \
            | sed 's/^process\.env\.//' \
            | sort -u \
            || true
